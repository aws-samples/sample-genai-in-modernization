AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Calculator Review Agent for AWS Transform - One-Click Deployment.
  Deploys IAM roles, ECR repository, CodeBuild project (builds ARM64 container),
  Bedrock AgentCore runtime, and Cognito User Pool for API authentication.

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  GitRepoUrl:
    Type: String
    Default: https://github.com/aws-samples/sample-genai-in-modernization.git
    Description: Git repository URL containing the agent source code
  GitBranch:
    Type: String
    Default: main
    Description: Git branch to build from
  ProjectSubdirectory:
    Type: String
    Default: agentic-ai-business-case/calculator-review-agent
    Description: Subdirectory within the repo containing the agent project
  AdminEmail:
    Type: String
    Description: Admin email for initial Cognito user (receives temporary password)
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
    ConstraintDescription: Must be a valid email address
  CognitoDomainPrefix:
    Type: String
    Description: >
      Unique prefix for Cognito hosted UI domain (e.g. calc-review-agent).
      Must be globally unique across all AWS accounts.
    AllowedPattern: '[a-z0-9-]+'
    ConstraintDescription: Only lowercase letters, numbers, and hyphens allowed
    MinLength: 3
    MaxLength: 63
  AgentName:
    Type: String
    Default: calculator-review-agent
    Description: Name for the agent in AWS Transform registry
    AllowedPattern: '[a-z0-9-]+'
  AgentVersion:
    Type: String
    Default: '1.0.0'
    Description: Semantic version for the agent

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Authentication
        Parameters:
          - AdminEmail
          - CognitoDomainPrefix
      - Label:
          default: Source Code
        Parameters:
          - GitRepoUrl
          - GitBranch
          - ProjectSubdirectory
      - Label:
          default: Agent Configuration
        Parameters:
          - AgentName
          - AgentVersion
    ParameterLabels:
      AdminEmail:
        default: Admin Email Address
      CognitoDomainPrefix:
        default: Cognito Domain Prefix (globally unique)
      GitRepoUrl:
        default: Git Repository URL
      GitBranch:
        default: Git Branch
      ProjectSubdirectory:
        default: Agent Subdirectory in Repo
      AgentName:
        default: Agent Name (for AWS Transform registry)
      AgentVersion:
        default: Agent Version

# ============================================================================
# Resources
# ============================================================================
Resources:

  # ==========================================================================
  # Cognito User Pool (API Authentication)
  # ==========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AgentName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AgentName}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO

  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref AdminEmail
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL

  # ==========================================================================
  # ECR Repository
  # ==========================================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    DependsOn: CleanupOnDelete
    Properties:
      RepositoryName: !Sub 'aws-transform-agents/${AgentName}'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ==========================================================================
  # Cleanup Lambda - Empties ECR and deletes AgentCore runtime on stack delete
  # ==========================================================================
  CleanupOnDeleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-cleanup'
      Runtime: python3.11
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt CleanupRole.Arn
      Environment:
        Variables:
          ECR_REPO_NAME: !Sub 'aws-transform-agents/${AgentName}'
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os

          def handler(event, context):
              if event['RequestType'] != 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              repo_name = os.environ['ECR_REPO_NAME']

              try:
                  ecr = boto3.client('ecr')
                  # List and delete all images in the ECR repository
                  paginator = ecr.get_paginator('list_images')
                  image_ids = []
                  for page in paginator.paginate(repositoryName=repo_name):
                      image_ids.extend(page.get('imageIds', []))

                  if image_ids:
                      # Delete in batches of 100
                      for i in range(0, len(image_ids), 100):
                          batch = image_ids[i:i+100]
                          ecr.batch_delete_image(
                              repositoryName=repo_name,
                              imageIds=batch
                          )
                      print(f"Deleted {len(image_ids)} images from {repo_name}")
                  else:
                      print(f"No images to delete in {repo_name}")

              except ecr.exceptions.RepositoryNotFoundException:
                  print(f"Repository {repo_name} not found, skipping")
              except Exception as e:
                  print(f"ECR cleanup error (non-fatal): {e}")

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:DescribeRepositories
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/aws-transform-agents/${AgentName}'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  CleanupOnDelete:
    Type: Custom::CleanupOnDelete
    Properties:
      ServiceToken: !GetAtt CleanupOnDeleteFunction.Arn

  # ==========================================================================
  # IAM Roles
  # ==========================================================================
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AgentCoreExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentCoreExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'transform-agents:*'
                  - 'eg-agenticapi:*'
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                Resource: '*'

  AWSTransformAgentInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSTransformAgentInvokeRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: prod.us-east-1.compute.elastic-gumby.aws.internal
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                Resource: '*'

  # ==========================================================================
  # CodeBuild - Builds ARM64 container and pushes to ECR
  # ==========================================================================
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AgentName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AgentName}-build'
      Description: Builds Calculator Review Agent ARM64 container image
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref 'AWS::Region'
          - Name: IMAGE_REPO_NAME
            Value: !Sub 'aws-transform-agents/${AgentName}'
          - Name: IMAGE_TAG
            Value: latest
          - Name: PROJECT_SUBDIR
            Value: !Ref ProjectSubdirectory
          - Name: GIT_REPO_URL
            Value: !Ref GitRepoUrl
          - Name: GIT_BRANCH
            Value: !Ref GitBranch
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
                - echo Cloning repository...
                - git clone --branch $GIT_BRANCH --depth 1 $GIT_REPO_URL repo
            build:
              commands:
                - echo Building Docker image...
                - cd repo/$PROJECT_SUBDIR
                - docker build --platform linux/arm64 -t $IMAGE_REPO_NAME:$IMAGE_TAG .
                - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
            post_build:
              commands:
                - echo Pushing Docker image to ECR...
                - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                - echo Build completed on `date`
      TimeoutInMinutes: 15

  # ==========================================================================
  # Custom Resource - Trigger CodeBuild on stack creation
  # ==========================================================================
  TriggerBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-trigger-build'
      Runtime: python3.11
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt TriggerBuildRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref CodeBuildProject
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import os

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  cb = boto3.client('codebuild')
                  response = cb.start_build(
                      projectName=os.environ['PROJECT_NAME']
                  )
                  build_id = response['build']['id']

                  # Poll until complete (max 10 min)
                  for _ in range(60):
                      time.sleep(10)
                      build = cb.batch_get_builds(ids=[build_id])['builds'][0]
                      status = build['buildStatus']
                      if status == 'SUCCEEDED':
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {'BuildId': build_id})
                          return
                      elif status in ('FAILED', 'FAULT', 'STOPPED', 'TIMED_OUT'):
                          phases = build.get('phases', [])
                          fail_reason = ''
                          for phase in phases:
                              if phase.get('phaseStatus') == 'FAILED':
                                  contexts = phase.get('contexts', [])
                                  if contexts:
                                      fail_reason = contexts[0].get('message', '')
                                  break
                          cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': f'Build {status}: {fail_reason}'})
                          return

                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': 'Build timed out'})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  TriggerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TriggerBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  TriggerBuild:
    Type: Custom::TriggerBuild
    DependsOn:
      - ECRRepository
      - CodeBuildProject
    Properties:
      ServiceToken: !GetAtt TriggerBuildFunction.Arn

  # ==========================================================================
  # Bedrock AgentCore Runtime Deployment (Custom Resource)
  # ==========================================================================
  DeployAgentCoreFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-deploy-agentcore'
      Runtime: python3.11
      Handler: index.handler
      Timeout: 600
      Role: !GetAtt DeployAgentCoreRole.Arn
      Environment:
        Variables:
          IMAGE_URI: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-transform-agents/${AgentName}:latest'
          EXECUTION_ROLE_ARN: !GetAtt AgentCoreExecutionRole.Arn
          AGENT_NAME: !Ref AgentName
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import os
          import re

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  # On delete, attempt to stop and delete the runtime
                  runtime_id = event.get('PhysicalResourceId', '')
                  if runtime_id and runtime_id != 'NONE':
                      try:
                          client = boto3.client('bedrock-agentcore-control', region_name='us-east-1')
                          client.delete_agent_runtime(agentRuntimeId=runtime_id)
                          # Wait for deletion (best effort)
                          for _ in range(18):
                              time.sleep(10)
                              try:
                                  resp = client.get_agent_runtime(agentRuntimeId=runtime_id)
                                  if resp.get('status') in ('DELETED', 'DELETE_FAILED'):
                                      break
                              except Exception:
                                  break  # Runtime no longer exists
                      except Exception as e:
                          print(f"Runtime deletion error (non-fatal): {e}")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  client = boto3.client('bedrock-agentcore-control', region_name='us-east-1')
                  agent_name = os.environ['AGENT_NAME'].replace('-', '_')
                  runtime_name = f"{agent_name}_{int(time.time())}"
                  # Ensure name matches [a-zA-Z][a-zA-Z0-9_]{0,47}
                  runtime_name = re.sub(r'[^a-zA-Z0-9_]', '_', runtime_name)[:48]

                  response = client.create_agent_runtime(
                      agentRuntimeName=runtime_name,
                      agentRuntimeArtifact={
                          'containerConfiguration': {
                              'containerUri': os.environ['IMAGE_URI']
                          }
                      },
                      roleArn=os.environ['EXECUTION_ROLE_ARN'],
                      networkConfiguration={'networkMode': 'PUBLIC'}
                  )

                  runtime_arn = response['agentRuntimeArn']
                  runtime_id = runtime_arn.split('/')[-1]

                  # Poll until READY (max 5 min)
                  for _ in range(30):
                      time.sleep(10)
                      status_resp = client.get_agent_runtime(agentRuntimeId=runtime_id)
                      status = status_resp.get('status', '')
                      if status in ('READY', 'ACTIVE'):
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              'RuntimeArn': runtime_arn,
                              'RuntimeId': runtime_id,
                              'Status': status,
                          }, runtime_id)
                          return
                      elif status == 'FAILED':
                          cfnresponse.send(event, context, cfnresponse.FAILED, {
                              'Error': f'Runtime creation FAILED: {status_resp.get("statusReason", "unknown")}'
                          }, 'NONE')
                          return

                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': 'Runtime creation timed out'}, 'NONE')
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, 'NONE')

  DeployAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployAgentCorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntime
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:DeleteAgentRuntime
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentCoreExecutionRole.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  DeployAgentCore:
    Type: Custom::DeployAgentCore
    DependsOn: TriggerBuild
    Properties:
      ServiceToken: !GetAtt DeployAgentCoreFunction.Arn

  # ==========================================================================
  # AWS Agent Registry Registration (Custom Resource)
  # ==========================================================================
  RegisterAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-register-transform'
      Runtime: python3.11
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt RegisterAgentRole.Arn
      Environment:
        Variables:
          AGENT_NAME: !Ref AgentName
          AGENT_VERSION: !Ref AgentVersion
          ACCOUNT_ID: !Ref 'AWS::AccountId'
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import os
          import time

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  agent_name = os.environ['AGENT_NAME']
                  agent_version = os.environ['AGENT_VERSION']
                  account_id = os.environ['ACCOUNT_ID']
                  runtime_arn = event['ResourceProperties'].get('RuntimeArn', '')

                  if not runtime_arn:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': 'RuntimeArn not provided'})
                      return

                  control_client = boto3.client('bedrock-agentcore-control', region_name='us-east-1')

                  # Step 1: Create registry (or use existing)
                  registry_name = f"{agent_name}-registry"
                  registry_id = None
                  try:
                      resp = control_client.create_registry(
                          name=registry_name,
                          description=f'Registry for {agent_name}'
                      )
                      registry_id = resp['registryArn'].split('/')[-1]
                      # Wait for READY
                      for _ in range(12):
                          time.sleep(5)
                          r = control_client.get_registry(registryId=registry_id)
                          if r.get('status') == 'READY':
                              break
                  except control_client.exceptions.ConflictException:
                      # Registry already exists, list and find it
                      registries = control_client.list_registries()
                      for reg in registries.get('registries', []):
                          if reg.get('name') == registry_name:
                              registry_id = reg['registryId']
                              break

                  if not registry_id:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': 'Could not create or find registry'})
                      return

                  # Step 2: Create registry record (A2A agent type)
                  agent_card = json.dumps({
                      "name": "Calculator Review Agent",
                      "description": "Analyzes AWS Pricing Calculator URLs for infrastructure completeness, MAP qualification, and cost optimization.",
                      "version": agent_version,
                      "protocolVersion": "0.3.0",
                      "url": f"arn:aws:bedrock-agentcore:us-east-1:{account_id}:runtime/{runtime_arn.split('/')[-1]}",
                      "capabilities": {},
                      "defaultInputModes": ["text/plain"],
                      "defaultOutputModes": ["text/plain"],
                      "skills": [
                          {
                              "id": "analyze-calculator-url",
                              "name": "Analyze Calculator URL",
                              "description": "Accepts an AWS Pricing Calculator URL (ESC or non-ESC) and returns service breakdown with MAP qualification, optimization opportunities, and modernization pathway analysis",
                              "tags": ["pricing", "calculator", "migration", "MAP"]
                          }
                      ]
                  })

                  try:
                      record_resp = control_client.create_registry_record(
                          registryId=registry_id,
                          name=agent_name,
                          descriptorType='A2A',
                          descriptors={
                              'a2a': {
                                  'agentCard': {
                                      'schemaVersion': '0.3',
                                      'inlineContent': agent_card
                                  }
                              }
                          },
                          recordVersion=agent_version
                      )
                      record_id = record_resp['recordId']
                  except control_client.exceptions.ConflictException:
                      # Record already exists
                      records = control_client.list_registry_records(registryId=registry_id)
                      record_id = None
                      for rec in records.get('registryRecords', []):
                          if rec.get('name') == agent_name:
                              record_id = rec['recordId']
                              break
                      if not record_id:
                          cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': 'Record exists but not found'})
                          return

                  # Wait for record to be in DRAFT status
                  time.sleep(5)

                  # Step 3: Submit for approval and approve
                  try:
                      control_client.submit_registry_record_for_approval(
                          registryId=registry_id,
                          recordId=record_id
                      )
                      time.sleep(2)
                      control_client.update_registry_record_status(
                          registryId=registry_id,
                          recordId=record_id,
                          status='APPROVED',
                          statusReason='Auto-approved during stack deployment'
                      )
                  except Exception:
                      pass  # May already be approved

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'RegistryId': registry_id,
                      'RecordId': record_id,
                      'AgentName': agent_name,
                  })
              except Exception as e:
                  # Registration failure is non-fatal
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'Warning': f'Registration completed with note: {str(e)}',
                      'AgentName': os.environ.get('AGENT_NAME', ''),
                  })

  RegisterAgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegisterAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                  - bedrock-agentcore-control:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  RegisterAgent:
    Type: Custom::RegisterAgent
    DependsOn: DeployAgentCore
    Properties:
      ServiceToken: !GetAtt RegisterAgentFunction.Arn
      RuntimeArn: !GetAtt DeployAgentCore.RuntimeArn

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  ECRImageUri:
    Description: ECR image URI for the agent container
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aws-transform-agents/${AgentName}:latest'

  AgentCoreRuntimeArn:
    Description: Bedrock AgentCore runtime ARN
    Value: !GetAtt DeployAgentCore.RuntimeArn

  AgentCoreRuntimeId:
    Description: Bedrock AgentCore runtime ID
    Value: !GetAtt DeployAgentCore.RuntimeId

  RegistryId:
    Description: AWS Agent Registry ID
    Value: !GetAtt RegisterAgent.RegistryId

  AgentCoreExecutionRoleArn:
    Description: ARN of the Bedrock AgentCore execution role
    Value: !GetAtt AgentCoreExecutionRole.Arn

  AWSTransformAgentInvokeRoleArn:
    Description: ARN of the AWS Transform invoke role (for AWS Transform composability integration)
    Value: !GetAtt AWSTransformAgentInvokeRole.Arn

  CognitoUserPoolId:
    Description: Cognito User Pool ID for API authentication
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient

  CognitoDomain:
    Description: Cognito hosted UI domain
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'

  AgentName:
    Description: Agent name in AWS Transform registry
    Value: !Ref AgentName

  AgentVersion:
    Description: Agent version
    Value: !Ref AgentVersion

  DeploymentStatus:
    Description: Deployment status
    Value: >
      Fully deployed! Agent is built, deployed to Bedrock AgentCore, and registered
      with AWS Transform. Test it from the AWS Transform console or via the Agentic API.
